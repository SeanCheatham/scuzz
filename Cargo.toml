[workspace]
resolver = "2"
members = [
    "crates/compiler",
    "crates/cli",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SeanCheatham/scuzz"

[workspace.dependencies]
scuzz-compiler = { path = "crates/compiler" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tempfile = "3"
