name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rustfmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p scuzz -p scuzz-compiler --all-targets -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity -A clippy::if_same_then_else -A clippy::collapsible_if -A clippy::redundant_guards -A clippy::useless_format -A clippy::identity_op -A clippy::len_zero -A clippy::unnecessary_to_owned

  linux-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer help + GitHub dry-run
        run: |
          ./scripts/install.sh --help
          SCUZZ_INSTALL_SOURCE=github SCUZZ_INSTALL_DRY_RUN=1 ./scripts/install.sh | tee /tmp/install-dry.out
          grep -q 'source=github SeanCheatham/scuzz latest' /tmp/install-dry.out
          grep -q 'api.github.com/repos/SeanCheatham/scuzz/releases' /tmp/install-dry.out
          grep -q 'asset=scuzz-' /tmp/install-dry.out
          SCUZZ_INSTALL_SOURCE=github SCUZZ_VERSION=v0.1.0 SCUZZ_INSTALL_DRY_RUN=1 ./scripts/install.sh | tee /tmp/install-pin.out
          grep -q 'releases/download/v0.1.0/scuzz-' /tmp/install-pin.out
          ./scripts/install.sh --dry-run | tee /tmp/install-checkout-dry.out
          grep -q 'source=checkout' /tmp/install-checkout-dry.out
          cat scripts/install.sh | sh -s -- --dry-run | tee /tmp/install-pipe.out
          grep -q 'source=github SeanCheatham/scuzz latest' /tmp/install-pipe.out
          grep -q 'api.github.com/repos/SeanCheatham/scuzz/releases' /tmp/install-pipe.out
          printf '%s\n' '"tag_name": "skia-cpu-v0.1"' '"tag_name": "v0.1.0-rc.1"' '"tag_name": "v0.2.0"' > /tmp/releases.json
          SCUZZ_RELEASES_JSON=/tmp/releases.json SCUZZ_INSTALL_SOURCE=github SCUZZ_INSTALL_DRY_RUN=1 ./scripts/install.sh | tee /tmp/install-tag.out
          grep -q 'tag=v0.2.0' /tmp/install-tag.out

      - name: Install clang/make/X11/xvfb + Skia link deps
        run: |
          sudo apt-get update
          # zlib/bz2: host libs for the Skia CPU prebuilt.
          sudo apt-get install -y clang make libx11-dev xvfb \
            zlib1g-dev libbz2-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dri

      - name: Install Rust (stable with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime + UI tests
        run: make -C crates/runtime test CC=clang

      - name: Runtime ASan (optional sanitizer; skips if unsupported)
        run: make -C crates/runtime test-asan CC=clang

      - name: ffi-skia tests
        run: |
          make -C crates/ffi-skia test CC=clang
          grep -qx skia crates/ffi-skia/build/sk_capi_backend

      - name: Embedder libs
        run: |
          make -C crates/embedder-desktop lib CC=clang
          make -C crates/embedder-mobile lib CC=clang

      - name: Build CLI
        run: cargo build -p scuzz

      - name: Compiler unit tests
        run: cargo test -p scuzz-compiler

      - name: Hello world → LLVM → native
        run: |
          cargo run -p scuzz -- build --full examples/hello
          ./examples/hello/build/hello | tee /tmp/hello.out
          grep -q "Hello, Scuzz!" /tmp/hello.out
          grep -q "ready." /tmp/hello.out

      - name: Kernel + IO kits + incremental build
        run: |
          cargo run -p scuzz -- run examples/kernel | tee /tmp/kernel.out
          grep -q "adt:red" /tmp/kernel.out
          grep -q "record:8" /tmp/kernel.out
          grep -q "Point(3,5)" /tmp/kernel.out
          grep -q "get:3" /tmp/kernel.out
          grep -q "show:box" /tmp/kernel.out
          grep -q "show:some" /tmp/kernel.out
          grep -q "get:2" /tmp/kernel.out
          grep -q "7ok" /tmp/kernel.out
          grep -q "float:3.0" /tmp/kernel.out
          grep -q "from:3.0" /tmp/kernel.out
          grep -q "to:2" /tmp/kernel.out
          grep -q "cmp:lt" /tmp/kernel.out
          grep -q "neg:-1.5" /tmp/kernel.out
          grep -q "map:1" /tmp/kernel.out
          grep -q "miss:no" /tmp/kernel.out
          grep -q "has:y" /tmp/kernel.out
          grep -q "set:y" /tmp/kernel.out
          grep -q "keys:a,b" /tmp/kernel.out
          grep -q "msize:2" /tmp/kernel.out
          grep -q "gone:n" /tmp/kernel.out
          grep -q "slist:x,y" /tmp/kernel.out
          grep -q "ssize:2" /tmp/kernel.out
          grep -q "sgone:n" /tmp/kernel.out
          grep -q "take:a,b" /tmp/kernel.out
          grep -q "drop:b,c" /tmp/kernel.out
          grep -q "find:b" /tmp/kernel.out
          grep -q "exists:y" /tmp/kernel.out
          grep -q "takeWhile:a" /tmp/kernel.out
          grep -q "dropWhile:b,c" /tmp/kernel.out
          grep -q "forall:y" /tmp/kernel.out
          grep -q "contains:y" /tmp/kernel.out
          grep -q "ends:y" /tmp/kernel.out
          grep -q "toInt:7" /tmp/kernel.out
          grep -q "miss:9" /tmp/kernel.out
          grep -q "repl:a:b" /tmp/kernel.out
          cargo run -p scuzz -- run examples/io | tee /tmp/io.out
          grep -q "ref-ok" /tmp/io.out
          grep -q "queue-ok" /tmp/io.out
          grep -q "deferred-ok" /tmp/io.out
          grep -q "fork-ok" /tmp/io.out
          grep -q "interrupted" /tmp/io.out
          grep -q "repeat-ok" /tmp/io.out
          grep -q "retry-ok" /tmp/io.out
          grep -q "forever-stopped" /tmp/io.out
          grep -q "use:token" /tmp/io.out
          grep -q "release:token" /tmp/io.out
          grep -q "release:token2" /tmp/io.out
          grep -q "recovered" /tmp/io.out
          grep -q "timeout-fast" /tmp/io.out
          grep -q "got:ok" /tmp/io.out
          grep -q "timed-out" /tmp/io.out
          grep -q "release:to-tok" /tmp/io.out
          grep -q "a!,b!,c" /tmp/io.out
          grep -q "drain:d" /tmp/io.out
          grep -q "filter:a,b" /tmp/io.out
          grep -q "map:a!,b!" /tmp/io.out
          grep -q "takeWhile:a,b" /tmp/io.out
          grep -q "dropWhile:a,b" /tmp/io.out
          grep -q "find:a" /tmp/io.out
          grep -q "exists:1" /tmp/io.out
          grep -q "miss:0" /tmp/io.out
          grep -q "fs:fs-note" /tmp/io.out
          grep -q "real:" /tmp/io.out
          grep -q "mono:" /tmp/io.out
          grep -q "impurity-ok" /tmp/io.out
          grep -q "fs:" /tmp/io.out
          grep -q "net:" /tmp/io.out
          cargo run -p scuzz -- test examples/io | tee /tmp/io-test.out
          grep -q "served:/" /tmp/io-test.out
          cargo run -p scuzz -- check examples/kernel
          cargo run -p scuzz -- check --message-format=json examples/hello | tee /tmp/hello-check.json
          grep -q '^\[\]$' /tmp/hello-check.json
          cargo run -p scuzz -- lsp --help | tee /tmp/lsp-help.txt
          grep -q "scuzz check" /tmp/lsp-help.txt
          if cargo run -p scuzz -- check testdata/fmt/needs_format 2>/tmp/fmt-check.err; then echo "expected format error" && exit 1; fi
          grep -q "needs formatting" /tmp/fmt-check.err
          cargo run -p scuzz -- build examples/kernel
          cargo run -p scuzz -- build examples/kernel 2>&1 | tee /tmp/incr.out
          grep -q "up-to-date" /tmp/incr.out
          # Path-dep invalidation: a change in a dependency source must rebuild the root.
          cargo run -p scuzz -- build --full examples/counter
          cargo run -p scuzz -- build examples/counter 2>&1 | tee /tmp/counter-incr.out
          grep -q "up-to-date" /tmp/counter-incr.out
          cp examples/shared/src/Shared.scuzz /tmp/shared-orig.scuzz
          printf 'def counterTitle(): String =\n  "Counter"\n\ndef countLabel(n: Int): String =\n  s"count = $n!"\n' > examples/shared/src/Shared.scuzz
          cargo run -p scuzz -- build examples/counter 2>&1 | tee /tmp/counter-inval.out
          if grep -q "up-to-date" /tmp/counter-inval.out; then echo "dependency edit should invalidate fingerprint" && exit 1; fi
          cp /tmp/shared-orig.scuzz examples/shared/src/Shared.scuzz
          cargo run -p scuzz -- build --full examples/counter

      - name: Package release + install-from-tarball smoke
        run: |
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          ./scripts/package_release.sh
          test -f "dist/scuzz-${TRIPLE}.tar.gz"
          test -x "dist/scuzz-${TRIPLE}/bin/scuzz"
          SKIA_TRIPLE="$(./scripts/skia_triple.sh)"
          test -f "dist/scuzz-${TRIPLE}/third_party/skia/prebuilt/${SKIA_TRIPLE}/libsk_capi.a"
          PREFIX=/tmp/scuzz-prefix
          rm -rf "$PREFIX"
          RELEASE_TGZ="$PWD/dist/scuzz-${TRIPLE}.tar.gz" PREFIX="$PREFIX" ./scripts/install.sh
          export PATH="$PREFIX/bin:$PATH"
          unset SCUZZ_HOME SCUZZ_RUNTIME || true
          test "$(command -v scuzz)" = "$PREFIX/bin/scuzz"
          rm -rf /tmp/scuzz-release-app
          scuzz new --ui --path /tmp scuzz-release-app
          scuzz test --update /tmp/scuzz-release-app
          scuzz test /tmp/scuzz-release-app
          test -f /tmp/scuzz-release-app/goldens/scuzz-release-app.dump
          grep -qx skia "$PREFIX/share/scuzz/crates/ffi-skia/build/sk_capi_backend"
          scuzz run --headless /tmp/scuzz-release-app
          test -f /tmp/scuzz-release-app/build/snapshot.png

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-linux-x86_64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Headless UI + golden PNGs
        run: |
          cargo run -p scuzz -- run --headless examples/counter
          test -f examples/counter/build/snapshot.png
          cargo run -p scuzz -- test examples/counter
          cargo run -p scuzz -- run --headless examples/studio
          test -f examples/studio/build/snapshot.png
          cargo run -p scuzz -- test examples/studio

      - name: Pixel goldens (sk_sw software backend)
        run: |
          SCUZZ_SKIA=sk_sw make -C crates/ffi-skia clean lib CC=clang
          rm -rf examples/counter/build
          SCUZZ_SKIA=sk_sw cargo run -p scuzz -- test --pixels examples/counter
          make -C crates/ffi-skia clean lib CC=clang

      - name: GPU presenter (OpenGL readback)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a env SCUZZ_SKIA=gpu make -C crates/ffi-skia test CC=clang
          xvfb-run -a env SCUZZ_SKIA=gpu cargo run -p scuzz -- test examples/counter
          make -C crates/ffi-skia clean lib CC=clang

      - name: Deterministic fuzz (bounded) + repro replay
        run: |
          cargo run -p scuzz -- fuzz --iters 16 examples/counter
          cargo run -p scuzz -- fuzz --iters 16 examples/studio
          cargo run -p scuzz -- fuzz --exhaust --depth 1 examples/counter
          rm -rf /tmp/scuzz-fuzzbug
          cargo run -p scuzz -- new --ui --path /tmp scuzz-fuzzbug
          cat > /tmp/scuzz-fuzzbug/src/Main.scuzz <<'EOF'
          @main def main: IO[Unit] =
            for {
              count = Signal.int(0)
              label = Signal.map(count, n => s"count = $n")
              _ <- Ui.run(_ => View.column(
                View.text("Bug"),
                View.bindText(label),
                View.row(View.button("boom", _ => Fs.read("/definitely/missing")))
              ))
            } yield ()
          EOF
          if cargo run -p scuzz -- fuzz --iters 8 /tmp/scuzz-fuzzbug; then
            echo "fuzz should have found the failure" && exit 1
          fi
          test -f /tmp/scuzz-fuzzbug/build/fuzz/repro.toml
          if cargo run -p scuzz -- fuzz --replay /tmp/scuzz-fuzzbug/build/fuzz/repro.toml /tmp/scuzz-fuzzbug; then
            echo "replay should have reproduced the failure" && exit 1
          fi
          rm -rf /tmp/scuzz-fuzzbug-ex
          cargo run -p scuzz -- new --ui --path /tmp scuzz-fuzzbug-ex
          cat > /tmp/scuzz-fuzzbug-ex/src/Main.scuzz <<'EOF'
          @main def main: IO[Unit] =
            for {
              count = Signal.int(0)
              label = Signal.map(count, n => s"count = $n")
              _ <- Ui.run(_ => View.column(
                View.text("Bug"),
                View.bindText(label),
                View.row(View.button("boom", _ => Fs.read("/definitely/missing")))
              ))
            } yield ()
          EOF
          if cargo run -p scuzz -- fuzz --exhaust --depth 1 /tmp/scuzz-fuzzbug-ex; then
            echo "exhaust should have found the failure" && exit 1
          fi
          test -f /tmp/scuzz-fuzzbug-ex/build/fuzz/repro.toml
          if cargo run -p scuzz -- fuzz --replay /tmp/scuzz-fuzzbug-ex/build/fuzz/repro.toml /tmp/scuzz-fuzzbug-ex; then
            echo "exhaust replay should have reproduced the failure" && exit 1
          fi
          rm -rf /tmp/scuzz-schedbug
          cargo run -p scuzz -- new --path /tmp scuzz-schedbug
          cat > /tmp/scuzz-schedbug/src/Main.scuzz <<'EOF'
          @main def main: IO[Unit] =
            for {
              q <- Queue.unbounded()
              _ <- IO.both(Queue.offer(q, "L"), Queue.offer(q, "R"))
              first <- Queue.take(q)
              _ <- if (Str.eq(first, "L")) IO.pure(()) else IO.fail("expected L first")
            } yield ()
          EOF
          cargo run -p scuzz -- test /tmp/scuzz-schedbug
          if cargo run -p scuzz -- fuzz --iters 8 /tmp/scuzz-schedbug; then
            echo "schedule fuzz should have found the interleaving bug" && exit 1
          fi
          test -f /tmp/scuzz-schedbug/build/fuzz/repro.toml
          grep -q 'schedule_seed' /tmp/scuzz-schedbug/build/fuzz/repro.toml
          if cargo run -p scuzz -- fuzz --replay /tmp/scuzz-schedbug/build/fuzz/repro.toml /tmp/scuzz-schedbug; then
            echo "schedule replay should have reproduced the failure" && exit 1
          fi
          grep -v schedule_seed /tmp/scuzz-schedbug/build/fuzz/repro.toml > /tmp/scuzz-schedbug/build/fuzz/repro-fifo.toml
          if ! cargo run -p scuzz -- fuzz --replay /tmp/scuzz-schedbug/build/fuzz/repro-fifo.toml /tmp/scuzz-schedbug; then
            echo "FIFO replay (no schedule_seed) should pass" && exit 1
          fi
          cargo run -p scuzz -- fuzz --iters 4 examples/io
          cargo run -p scuzz -- mutate examples/hello
          cargo run -p scuzz -- mutate --oracles examples/kernel --limit 2 --iters 0
          cargo run -p scuzz -- mutate --oracles examples/counter --limit 1 --iters 0
          cargo run -p scuzz -- mutate examples/kernel --limit 1 --iters 0

      - name: v0 new --ui path
        run: |
          rm -rf /tmp/scuzz-v0app
          cargo run -p scuzz -- new --ui --path /tmp scuzz-v0app
          cargo run -p scuzz -- test --update /tmp/scuzz-v0app
          test -f /tmp/scuzz-v0app/goldens/scuzz-v0app.dump
          test -f /tmp/scuzz-v0app/goldens/scuzz-v0app_after_tap.dump
          cargo run -p scuzz -- test /tmp/scuzz-v0app
          cargo run -p scuzz -- run --headless /tmp/scuzz-v0app
          test -f /tmp/scuzz-v0app/build/snapshot.png

      - name: Desktop peer + X11 embedder (xvfb)
        run: |
          # SCUZZ_LIVE_FRAMES bounds stay-open Ui.run under Desktop (else hangs on xvfb).
          timeout 30s xvfb-run -a env SCUZZ_UI_RUNTIME=desktop SCUZZ_LIVE_FRAMES=2 \
            SCUZZ_UI_WIDTH=400 SCUZZ_UI_HEIGHT=560 \
            ./examples/studio/build/studio 2>&1 | tee /tmp/win.out
          grep -q "desktop embedder" /tmp/win.out
          grep -q "X11 window" /tmp/win.out

      - name: Mobile peer + package shells
        run: |
          env SCUZZ_UI_RUNTIME=mobile SCUZZ_MOBILE_SHELL=1 SCUZZ_UI_WIDTH=200 SCUZZ_UI_HEIGHT=120 \
            ./examples/counter/build/counter 2>&1 | tee /tmp/mobile.out
          grep -q "UiRuntime.Mobile" /tmp/mobile.out
          grep -q "scuzz mobile: present" /tmp/mobile.out
          cargo run -p scuzz -- package --target host examples/counter
          test -x examples/counter/build/package/host/run.sh
          # Linux CI has no NDK/SDK. android must fail with one install line,
          # or emit a debug APK when the NDK and SDK are present.
          if cargo run -p scuzz -- package --target android examples/counter > /tmp/android-pkg.out 2>&1; then
            test -f examples/counter/build/package/android/lib/arm64-v8a/libscuzz.so
            test -f examples/counter/build/package/android/counter.apk
          else
            grep -Eq "ANDROID_NDK_HOME|ANDROID_HOME" /tmp/android-pkg.out
          fi
          # Linux has no Xcode. ios must fail with one install line.
          if cargo run -p scuzz -- package --target ios examples/counter > /tmp/ios-pkg.out 2>&1; then
            echo "ios package succeeded without Xcode" >&2
            cat /tmp/ios-pkg.out >&2
            exit 1
          fi
          grep -q "xcode-select --install" /tmp/ios-pkg.out
          env SCUZZ_UI_WIDTH=200 SCUZZ_UI_HEIGHT=120 \
            ./examples/counter/build/package/host/run.sh 2>&1 | tee /tmp/pkg-host.out
          grep -q "scuzz mobile: present" /tmp/pkg-host.out

  # Bounded Darwin coverage on every push/PR. Full packaging stays workflow_dispatch.
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Runtime tests
        run: make -C crates/runtime test CC=clang
      - name: Compiler unit tests
        run: cargo test -p scuzz-compiler
      - name: Hello smoke
        run: |
          cargo build -p scuzz
          cargo run -p scuzz -- build --full examples/hello
          cargo run -p scuzz -- test examples/hello
          cargo run -p scuzz -- check examples/kernel

  # Full macOS packaging. Skip on push/PR.
  # Trigger manually: Actions → ci → Run workflow.
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime + UI tests
        run: make -C crates/runtime test CC=clang

      - name: Build CLI + embedders
        run: |
          make -C crates/ffi-skia lib CC=clang
          grep -qx skia crates/ffi-skia/build/sk_capi_backend
          make -C crates/embedder-desktop lib CC=clang
          make -C crates/embedder-mobile lib CC=clang
          cargo build -p scuzz

      - name: Package release + install smoke
        run: |
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          ./scripts/package_release.sh
          test -f "dist/scuzz-${TRIPLE}.tar.gz"
          SKIA_TRIPLE="$(./scripts/skia_triple.sh)"
          test -f "dist/scuzz-${TRIPLE}/third_party/skia/prebuilt/${SKIA_TRIPLE}/libsk_capi.a"
          PREFIX=/tmp/scuzz-prefix
          rm -rf "$PREFIX"
          RELEASE_TGZ="$PWD/dist/scuzz-${TRIPLE}.tar.gz" PREFIX="$PREFIX" ./scripts/install.sh
          export PATH="$PREFIX/bin:$PATH"
          unset SCUZZ_HOME SCUZZ_RUNTIME || true
          rm -rf /tmp/scuzz-release-app
          scuzz new --ui --path /tmp scuzz-release-app
          scuzz test --update /tmp/scuzz-release-app
          scuzz test /tmp/scuzz-release-app
          grep -qx skia "$PREFIX/share/scuzz/crates/ffi-skia/build/sk_capi_backend"
          scuzz run --headless /tmp/scuzz-release-app

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-macos-arm64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Golden PNG tests
        run: |
          cargo run -p scuzz -- test examples/counter
          cargo run -p scuzz -- test examples/studio

      - name: Pixel goldens (sk_sw software backend)
        run: |
          SCUZZ_SKIA=sk_sw make -C crates/ffi-skia clean lib
          rm -rf examples/counter/build
          SCUZZ_SKIA=sk_sw cargo run -p scuzz -- test --pixels examples/counter
          make -C crates/ffi-skia clean lib
