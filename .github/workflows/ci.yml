name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang/make/X11/xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libx11-dev xvfb

      - name: Install Rust (stable via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime + UI tests
        run: make -C crates/runtime test CC=clang

      - name: ffi-skia tests
        run: make -C crates/ffi-skia test CC=clang

      - name: Embedder libs
        run: |
          make -C crates/embedder-desktop lib CC=clang
          make -C crates/embedder-mobile lib CC=clang

      - name: Build CLI
        run: cargo build -p scalui

      - name: Compiler unit tests
        run: cargo test -p scalui-compiler

      - name: Hello world → LLVM → native
        run: |
          cargo run -p scalui -- build --full examples/hello
          ./examples/hello/build/hello | tee /tmp/hello.out
          grep -q "Hello, ScalUI!" /tmp/hello.out
          grep -q "ready." /tmp/hello.out

      - name: Effects + ADT + FS + impurity + incremental build
        run: |
          cargo run -p scalui -- run examples/effects | tee /tmp/effects.out
          grep -q "ref-ok" /tmp/effects.out
          grep -q "both-ok" /tmp/effects.out
          cargo run -p scalui -- run examples/adt | tee /tmp/adt.out
          grep -q "adt:red" /tmp/adt.out
          cargo run -p scalui -- run examples/fs | tee /tmp/fs.out
          grep -q "fs:fs-note" /tmp/fs.out
          cargo run -p scalui -- run examples/clock | tee /tmp/clock.out
          grep -q "real:" /tmp/clock.out
          grep -q "mono:" /tmp/clock.out
          cargo run -p scalui -- run examples/impurity | tee /tmp/impurity.out
          grep -q "impurity-ok" /tmp/impurity.out
          grep -q "fs:" /tmp/impurity.out
          grep -q "net:" /tmp/impurity.out
          cargo run -p scalui -- fmt --check examples/adt
          cargo run -p scalui -- build examples/adt
          cargo run -p scalui -- build examples/adt 2>&1 | tee /tmp/incr.out
          grep -q "up-to-date" /tmp/incr.out

      - name: Self-host dual-boot
        run: ./scripts/selfhost.sh

      - name: Headless UI + golden PNGs
        run: |
          cargo run -p scalui -- run --headless examples/hello_ui
          test -f examples/hello_ui/build/snapshot.png
          cargo run -p scalui -- test examples/hello_ui
          cargo run -p scalui -- run --headless examples/counter
          test -f examples/counter/build/snapshot.png
          cargo run -p scalui -- test examples/counter
          cargo run -p scalui -- run --headless examples/todo
          test -f examples/todo/build/snapshot.png
          cargo run -p scalui -- test examples/todo
          cargo run -p scalui -- run --headless examples/nav
          test -f examples/nav/build/snapshot.png
          cargo run -p scalui -- test examples/nav

      - name: Deterministic fuzz (bounded) + repro replay
        run: |
          cargo run -p scalui -- fuzz --iters 16 examples/counter
          cargo run -p scalui -- fuzz --iters 16 examples/todo
          rm -rf /tmp/scalui-fuzzbug
          cargo run -p scalui -- new --ui --path /tmp scalui-fuzzbug
          cat > /tmp/scalui-fuzzbug/src/Main.scala <<'EOF'
          @main def main: IO[Unit] =
            for {
              count = Signal.int(0)
              root = View.column(
                View.text("Bug"),
                View.textSignal(count, "count = "),
                View.row(View.button("boom", _ => Fs.read("/definitely/missing")))
              )
              _ <- Ui.run(root)
            } yield ()
          EOF
          if cargo run -p scalui -- fuzz --iters 8 /tmp/scalui-fuzzbug; then
            echo "fuzz should have found the failure" && exit 1
          fi
          test -f /tmp/scalui-fuzzbug/build/fuzz/repro.toml
          if cargo run -p scalui -- fuzz /tmp/scalui-fuzzbug --replay /tmp/scalui-fuzzbug/build/fuzz/repro.toml; then
            echo "replay should have reproduced the failure" && exit 1
          fi

      - name: v0 new --ui happy path
        run: |
          rm -rf /tmp/scalui-v0app
          cargo run -p scalui -- new --ui --path /tmp scalui-v0app
          cargo run -p scalui -- test /tmp/scalui-v0app
          test -f /tmp/scalui-v0app/goldens/scalui-v0app.png
          test -f /tmp/scalui-v0app/goldens/scalui-v0app_after_tap.png
          cargo run -p scalui -- test /tmp/scalui-v0app
          cargo run -p scalui -- run --headless /tmp/scalui-v0app
          test -f /tmp/scalui-v0app/build/snapshot.png
          /tmp/stage1-scalui new --ui --path /tmp scalui-v0s1
          /tmp/stage1-scalui test /tmp/scalui-v0s1
          test -f /tmp/scalui-v0s1/goldens/scalui-v0s1.png
          /tmp/stage1-scalui run --headless /tmp/scalui-v0s1
          test -f /tmp/scalui-v0s1/build/snapshot.png

      - name: Window peer + X11 embedder (xvfb)
        run: |
          xvfb-run -a env SCALUI_UI_RUNTIME=window SCALUI_UI_WIDTH=200 SCALUI_UI_HEIGHT=100 \
            ./examples/hello_ui/build/hello_ui 2>&1 | tee /tmp/win.out
          grep -q "desktop embedder" /tmp/win.out
          grep -q "X11 window" /tmp/win.out

      - name: Mobile peer + package shells
        run: |
          env SCALUI_UI_RUNTIME=mobile SCALUI_MOBILE_SHELL=1 SCALUI_UI_WIDTH=200 SCALUI_UI_HEIGHT=120 \
            ./examples/counter/build/counter 2>&1 | tee /tmp/mobile.out
          grep -q "UiRuntime.Mobile" /tmp/mobile.out
          grep -q "scalui mobile: present" /tmp/mobile.out
          cargo run -p scalui -- package --target all examples/counter
          test -x examples/counter/build/package/host/run.sh
          test -f examples/counter/build/package/android/jni/scalui_jni.c
          test -f examples/counter/build/package/ios/ScaluiAppDelegate.m
          env SCALUI_UI_WIDTH=200 SCALUI_UI_HEIGHT=120 \
            ./examples/counter/build/package/host/run.sh 2>&1 | tee /tmp/pkg-host.out
          grep -q "scalui mobile: present" /tmp/pkg-host.out

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime + UI tests
        run: make -C crates/runtime test CC=clang

      - name: Build CLI + embedders
        run: |
          make -C crates/ffi-skia lib CC=clang
          make -C crates/embedder-desktop lib CC=clang
          make -C crates/embedder-mobile lib CC=clang
          cargo build -p scalui

      - name: Self-host dual-boot (default stack)
        run: ./scripts/selfhost.sh

      - name: Golden PNG tests
        run: |
          cargo run -p scalui -- test examples/hello_ui
          cargo run -p scalui -- test examples/counter
          cargo run -p scalui -- test examples/todo
          cargo run -p scalui -- test examples/nav
