name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer help + GitHub dry-run
        run: ./scripts/ci.sh install-dry

      - name: Install clang/make/X11/xvfb + Skia link deps
        run: |
          sudo apt-get update
          # zlib/bz2: host libs for the Skia CPU prebuilt.
          sudo apt-get install -y clang make libx11-dev xvfb \
            zlib1g-dev libbz2-dev libssl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dri

      - name: Runtime + UI tests
        run: ./scripts/ci.sh runtime

      - name: Runtime ASan (optional sanitizer; skips if unsupported)
        run: ./scripts/ci.sh asan

      - name: ffi-skia tests
        run: ./scripts/ci.sh skia

      - name: Embedder libs
        run: ./scripts/ci.sh embedders

      - name: Bootstrap product CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bootstrap.sh

      - name: Hello world → LLVM → native
        run: ./scripts/ci.sh hello

      - name: Typecheck oracle
        run: ./scripts/ci.sh tyck

      - name: Kit catalog
        run: ./scripts/ci.sh kits

      - name: Codegen emit + oracle
        run: ./scripts/ci.sh codegen

      - name: Hello via out-dir
        run: ./scripts/ci.sh hello-outdir

      - name: LLVM IR fixed-point
        run: ./scripts/ci.sh fixedpoint

      - name: Kernel + IO kits + incremental build
        run: ./scripts/ci.sh kernel

      - name: Package release + install-from-tarball smoke
        run: ./scripts/ci.sh package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-linux-x86_64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Headless UI + golden PNGs
        run: ./scripts/ci.sh ui

      - name: Pixel goldens (sk_sw software backend)
        run: ./scripts/ci.sh pixels

      - name: GPU presenter (OpenGL readback)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./scripts/ci.sh gpu

      - name: Differential structural dumps (skia vs sk_sw vs gpu)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./scripts/ci.sh differential

      - name: Deterministic fuzz (bounded) + repro replay
        run: ./scripts/ci.sh fuzz

      - name: v0 new --ui path
        run: ./scripts/ci.sh new-ui

      - name: Desktop peer + X11 embedder (xvfb)
        run: ./scripts/ci.sh desktop

      - name: Mobile peer + package shells
        run: ./scripts/ci.sh mobile

  # Bounded Darwin coverage on every push/PR. Full packaging stays workflow_dispatch.
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: Runtime tests
        run: ./scripts/ci.sh runtime
      - name: Bootstrap product CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bootstrap.sh
      - name: Hello smoke
        run: ./scripts/ci.sh macos-hello

  # Full macOS packaging. Skip on push/PR.
  # Trigger manually: Actions → ci → Run workflow.
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Runtime + UI tests
        run: ./scripts/ci.sh runtime

      - name: Build embedders
        run: ./scripts/ci.sh embedders

      - name: Package release + install smoke
        run: ./scripts/ci.sh package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-macos-arm64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Golden PNG tests
        run: ./scripts/ci.sh ui-test

      - name: Pixel goldens (sk_sw software backend)
        run: ./scripts/ci.sh pixels
