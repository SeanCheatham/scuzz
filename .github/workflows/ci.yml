name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang/make/X11/xvfb + Skia link deps
        run: |
          sudo apt-get update
          # zlib/bz2/brotli: Stage-2 release packs the pinned Skia CPU prebuilt;
          # linking [ui] apps needs these (same as skia-cpu.yml runtime link set).
          sudo apt-get install -y clang make libx11-dev xvfb \
            zlib1g-dev libbz2-dev libbrotli-dev

      - name: Install Rust (stable via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Runtime + UI tests
        run: make -C crates/runtime test CC=clang

      - name: Runtime ASan (optional sanitizer; skips if unsupported)
        run: make -C crates/runtime test-asan CC=clang

      - name: ffi-skia tests
        run: |
          make -C crates/ffi-skia test CC=clang
          grep -qx skia crates/ffi-skia/build/sk_capi_backend

      - name: Embedder libs
        run: |
          make -C crates/embedder-desktop lib CC=clang
          make -C crates/embedder-mobile lib CC=clang

      - name: Build CLI
        run: cargo build -p scuzz

      - name: Compiler unit tests
        run: cargo test -p scuzz-compiler

      - name: Hello world → LLVM → native
        run: |
          cargo run -p scuzz -- build --full examples/hello
          ./examples/hello/build/hello | tee /tmp/hello.out
          grep -q "Hello, Scuzz!" /tmp/hello.out
          grep -q "ready." /tmp/hello.out

      - name: Concurrency + ADT + record/trait/generic + FS + impurity + incremental build
        run: |
          cargo run -p scuzz -- run examples/concurrency | tee /tmp/concurrency.out
          grep -q "ref-ok" /tmp/concurrency.out
          grep -q "queue-ok" /tmp/concurrency.out
          grep -q "deferred-ok" /tmp/concurrency.out
          cargo run -p scuzz -- run examples/resource | tee /tmp/resource.out
          grep -q "use:token" /tmp/resource.out
          grep -q "release:token" /tmp/resource.out
          grep -q "release:token2" /tmp/resource.out
          grep -q "recovered" /tmp/resource.out
          cargo run -p scuzz -- run examples/stream | tee /tmp/stream.out
          grep -q "a!,b!,c" /tmp/stream.out
          grep -q "drain:d" /tmp/stream.out
          cargo run -p scuzz -- run examples/adt | tee /tmp/adt.out
          grep -q "adt:red" /tmp/adt.out
          cargo run -p scuzz -- run examples/record | tee /tmp/record.out
          grep -q "record:8" /tmp/record.out
          cargo run -p scuzz -- run examples/trait | tee /tmp/trait.out
          grep -q "Point(3,5)" /tmp/trait.out
          cargo run -p scuzz -- run examples/generic | tee /tmp/generic.out
          grep -q "7ok" /tmp/generic.out
          cargo run -p scuzz -- run examples/fs | tee /tmp/fs.out
          grep -q "fs:fs-note" /tmp/fs.out
          cargo run -p scuzz -- run examples/clock | tee /tmp/clock.out
          grep -q "real:" /tmp/clock.out
          grep -q "mono:" /tmp/clock.out
          cargo run -p scuzz -- run examples/impurity | tee /tmp/impurity.out
          grep -q "impurity-ok" /tmp/impurity.out
          grep -q "fs:" /tmp/impurity.out
          grep -q "net:" /tmp/impurity.out
          cargo run -p scuzz -- fmt --check examples/adt
          cargo run -p scuzz -- build examples/adt
          cargo run -p scuzz -- build examples/adt 2>&1 | tee /tmp/incr.out
          grep -q "up-to-date" /tmp/incr.out
          # Path-dep invalidation: changing a dependency source must rebuild the root.
          cargo run -p scuzz -- build --full examples/counter
          cargo run -p scuzz -- build examples/counter 2>&1 | tee /tmp/counter-incr.out
          grep -q "up-to-date" /tmp/counter-incr.out
          cp examples/shared/src/Shared.scuzz /tmp/shared-orig.scuzz
          printf 'def counterTitle(): String =\n  "Counter"\n\ndef countLabel(n: Int): String =\n  s"count = $n!"\n' > examples/shared/src/Shared.scuzz
          cargo run -p scuzz -- build examples/counter 2>&1 | tee /tmp/counter-inval.out
          if grep -q "up-to-date" /tmp/counter-inval.out; then echo "dependency edit should invalidate fingerprint" && exit 1; fi
          cp /tmp/shared-orig.scuzz examples/shared/src/Shared.scuzz
          cargo run -p scuzz -- build --full examples/counter

      - name: Self-host dual-boot
        run: ./scripts/selfhost.sh

      - name: Package Stage-2 release + install-from-tarball smoke
        run: |
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          # Stage 1 from selfhost rebuilds compiler-scuzz → Stage 2 (no cargo).
          SCUZZ_BOOTSTRAP=/tmp/stage1-scuzz ./scripts/package_release.sh
          test -f "dist/scuzz-${TRIPLE}.tar.gz"
          test -x "dist/scuzz-${TRIPLE}/bin/scuzz"
          grep -q '^stage=2$' "dist/scuzz-${TRIPLE}/VERSION"
          SKIA_TRIPLE="$(./scripts/skia_triple.sh)"
          test -f "dist/scuzz-${TRIPLE}/third_party/skia/prebuilt/${SKIA_TRIPLE}/libsk_capi.a"
          PREFIX=/tmp/scuzz-prefix
          rm -rf "$PREFIX"
          RELEASE_TGZ="$PWD/dist/scuzz-${TRIPLE}.tar.gz" PREFIX="$PREFIX" ./scripts/install.sh
          export PATH="$PREFIX/bin:$PATH"
          unset SCUZZ_HOME SCUZZ_RUNTIME || true
          test "$(command -v scuzz)" = "$PREFIX/bin/scuzz"
          rm -rf /tmp/scuzz-release-app
          scuzz new --ui --path /tmp scuzz-release-app
          scuzz test /tmp/scuzz-release-app
          test -f /tmp/scuzz-release-app/goldens/scuzz-release-app.dump
          grep -qx skia "$PREFIX/share/scuzz/crates/ffi-skia/build/sk_capi_backend"
          scuzz run --headless /tmp/scuzz-release-app
          test -f /tmp/scuzz-release-app/build/snapshot.png
          # Installed Stage-2 CLI is self-sufficient: rebuild the compiler without Rust.
          scuzz build "$GITHUB_WORKSPACE/compiler-scuzz"
          test -x "$GITHUB_WORKSPACE/compiler-scuzz/build/scuzz"

      - name: Upload Stage-2 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-linux-x86_64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Headless UI + golden PNGs
        run: |
          cargo run -p scuzz -- run --headless examples/hello_ui
          test -f examples/hello_ui/build/snapshot.png
          cargo run -p scuzz -- test examples/hello_ui
          cargo run -p scuzz -- run --headless examples/counter
          test -f examples/counter/build/snapshot.png
          cargo run -p scuzz -- test examples/counter
          cargo run -p scuzz -- run --headless examples/todo
          test -f examples/todo/build/snapshot.png
          cargo run -p scuzz -- test examples/todo
          cargo run -p scuzz -- run --headless examples/nav
          test -f examples/nav/build/snapshot.png
          cargo run -p scuzz -- test examples/nav

      - name: Deterministic fuzz (bounded) + repro replay (Stage-2 CLI)
        run: |
          /tmp/stage2-scuzz fuzz --iters 16 examples/counter
          /tmp/stage2-scuzz fuzz --iters 16 examples/todo
          /tmp/stage2-scuzz fuzz --exhaust --depth 1 examples/counter
          rm -rf /tmp/scuzz-fuzzbug
          /tmp/stage2-scuzz new --ui --path /tmp scuzz-fuzzbug
          cat > /tmp/scuzz-fuzzbug/src/Main.scuzz <<'EOF'
          @main def main: IO[Unit] =
            for {
              count = Signal.int(0)
              label = Signal.map(count, n => s"count = $n")
              root = View.column(
                View.text("Bug"),
                View.bindText(label),
                View.row(View.button("boom", _ => Fs.read("/definitely/missing")))
              )
              _ <- Ui.run(root)
            } yield ()
          EOF
          if /tmp/stage2-scuzz fuzz --iters 8 /tmp/scuzz-fuzzbug; then
            echo "fuzz should have found the failure" && exit 1
          fi
          test -f /tmp/scuzz-fuzzbug/build/fuzz/repro.toml
          if /tmp/stage2-scuzz fuzz --replay /tmp/scuzz-fuzzbug/build/fuzz/repro.toml /tmp/scuzz-fuzzbug; then
            echo "replay should have reproduced the failure" && exit 1
          fi
          rm -rf /tmp/scuzz-fuzzbug-ex
          /tmp/stage2-scuzz new --ui --path /tmp scuzz-fuzzbug-ex
          cat > /tmp/scuzz-fuzzbug-ex/src/Main.scuzz <<'EOF'
          @main def main: IO[Unit] =
            for {
              count = Signal.int(0)
              label = Signal.map(count, n => s"count = $n")
              root = View.column(
                View.text("Bug"),
                View.bindText(label),
                View.row(View.button("boom", _ => Fs.read("/definitely/missing")))
              )
              _ <- Ui.run(root)
            } yield ()
          EOF
          if /tmp/stage2-scuzz fuzz --exhaust --depth 1 /tmp/scuzz-fuzzbug-ex; then
            echo "exhaust should have found the failure" && exit 1
          fi
          test -f /tmp/scuzz-fuzzbug-ex/build/fuzz/repro.toml
          if /tmp/stage2-scuzz fuzz --replay /tmp/scuzz-fuzzbug-ex/build/fuzz/repro.toml /tmp/scuzz-fuzzbug-ex; then
            echo "exhaust replay should have reproduced the failure" && exit 1
          fi
          rm -rf /tmp/scuzz-schedbug
          /tmp/stage2-scuzz new --path /tmp scuzz-schedbug
          cat > /tmp/scuzz-schedbug/src/Main.scuzz <<'EOF'
          @main def main: IO[Unit] =
            for {
              q <- Queue.unbounded()
              _ <- IO.both(Queue.offer(q, "L"), Queue.offer(q, "R"))
              first <- Queue.take(q)
              _ <- if (Str.eq(first, "L") == 1) IO.pure(()) else IO.fail("expected L first")
            } yield ()
          EOF
          /tmp/stage2-scuzz test /tmp/scuzz-schedbug
          if /tmp/stage2-scuzz fuzz --iters 8 /tmp/scuzz-schedbug; then
            echo "schedule fuzz should have found the interleaving bug" && exit 1
          fi
          test -f /tmp/scuzz-schedbug/build/fuzz/repro.toml
          grep -q 'schedule_seed' /tmp/scuzz-schedbug/build/fuzz/repro.toml
          if /tmp/stage2-scuzz fuzz --replay /tmp/scuzz-schedbug/build/fuzz/repro.toml /tmp/scuzz-schedbug; then
            echo "schedule replay should have reproduced the failure" && exit 1
          fi
          grep -v schedule_seed /tmp/scuzz-schedbug/build/fuzz/repro.toml > /tmp/scuzz-schedbug/build/fuzz/repro-fifo.toml
          if ! /tmp/stage2-scuzz fuzz --replay /tmp/scuzz-schedbug/build/fuzz/repro-fifo.toml /tmp/scuzz-schedbug; then
            echo "FIFO replay (no schedule_seed) should pass" && exit 1
          fi
          /tmp/stage2-scuzz fuzz --iters 4 examples/concurrency

      - name: v0 new --ui happy path
        run: |
          rm -rf /tmp/scuzz-v0app
          cargo run -p scuzz -- new --ui --path /tmp scuzz-v0app
          cargo run -p scuzz -- test /tmp/scuzz-v0app
          test -f /tmp/scuzz-v0app/goldens/scuzz-v0app.dump
          test -f /tmp/scuzz-v0app/goldens/scuzz-v0app_after_tap.dump
          cargo run -p scuzz -- test /tmp/scuzz-v0app
          cargo run -p scuzz -- run --headless /tmp/scuzz-v0app
          test -f /tmp/scuzz-v0app/build/snapshot.png
          /tmp/stage2-scuzz new --ui --path /tmp scuzz-v0s2
          /tmp/stage2-scuzz test /tmp/scuzz-v0s2
          test -f /tmp/scuzz-v0s2/goldens/scuzz-v0s2.dump
          /tmp/stage2-scuzz run --headless /tmp/scuzz-v0s2
          test -f /tmp/scuzz-v0s2/build/snapshot.png

      - name: Window peer + X11 embedder (xvfb)
        run: |
          # SCUZZ_LIVE_FRAMES bounds stay-open Ui.run under Window (else hangs on xvfb).
          timeout 30s xvfb-run -a env SCUZZ_UI_RUNTIME=window SCUZZ_LIVE_FRAMES=2 \
            SCUZZ_UI_WIDTH=200 SCUZZ_UI_HEIGHT=100 \
            ./examples/hello_ui/build/hello_ui 2>&1 | tee /tmp/win.out
          grep -q "desktop embedder" /tmp/win.out
          grep -q "X11 window" /tmp/win.out

      - name: Mobile peer + package shells
        run: |
          env SCUZZ_UI_RUNTIME=mobile SCUZZ_MOBILE_SHELL=1 SCUZZ_UI_WIDTH=200 SCUZZ_UI_HEIGHT=120 \
            ./examples/counter/build/counter 2>&1 | tee /tmp/mobile.out
          grep -q "UiRuntime.Mobile" /tmp/mobile.out
          grep -q "scuzz mobile: present" /tmp/mobile.out
          cargo run -p scuzz -- package --target all examples/counter
          test -x examples/counter/build/package/host/run.sh
          test -f examples/counter/build/package/android/jni/scuzz_jni.c
          test -f examples/counter/build/package/ios/ScuzzAppDelegate.m
          env SCUZZ_UI_WIDTH=200 SCUZZ_UI_HEIGHT=120 \
            ./examples/counter/build/package/host/run.sh 2>&1 | tee /tmp/pkg-host.out
          grep -q "scuzz mobile: present" /tmp/pkg-host.out

  # macOS is 10× Linux Actions minutes; skip on push/PR until we ship Darwin more seriously.
  # Trigger manually: Actions → ci → Run workflow.
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Homebrew Skia link deps
        run: brew install brotli bzip2

      - name: Runtime + UI tests
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix bzip2)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          make -C crates/runtime test CC=clang

      - name: Build CLI + embedders
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix bzip2)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          make -C crates/ffi-skia lib CC=clang
          grep -qx skia crates/ffi-skia/build/sk_capi_backend
          make -C crates/embedder-desktop lib CC=clang
          make -C crates/embedder-mobile lib CC=clang
          cargo build -p scuzz

      - name: Self-host dual-boot (default stack)
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix bzip2)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          ./scripts/selfhost.sh

      - name: Package Stage-2 release + install smoke
        run: |
          export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix bzip2)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          SCUZZ_BOOTSTRAP=/tmp/stage1-scuzz ./scripts/package_release.sh
          test -f "dist/scuzz-${TRIPLE}.tar.gz"
          grep -q '^stage=2$' "dist/scuzz-${TRIPLE}/VERSION"
          SKIA_TRIPLE="$(./scripts/skia_triple.sh)"
          test -f "dist/scuzz-${TRIPLE}/third_party/skia/prebuilt/${SKIA_TRIPLE}/libsk_capi.a"
          PREFIX=/tmp/scuzz-prefix
          rm -rf "$PREFIX"
          RELEASE_TGZ="$PWD/dist/scuzz-${TRIPLE}.tar.gz" PREFIX="$PREFIX" ./scripts/install.sh
          export PATH="$PREFIX/bin:$PATH"
          unset SCUZZ_HOME SCUZZ_RUNTIME || true
          rm -rf /tmp/scuzz-release-app
          scuzz new --ui --path /tmp scuzz-release-app
          scuzz test /tmp/scuzz-release-app
          grep -qx skia "$PREFIX/share/scuzz/crates/ffi-skia/build/sk_capi_backend"
          scuzz run --headless /tmp/scuzz-release-app

      - name: Upload Stage-2 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-macos-arm64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Golden PNG tests
        run: |
          cargo run -p scuzz -- test examples/hello_ui
          cargo run -p scuzz -- test examples/counter
          cargo run -p scuzz -- test examples/todo
          cargo run -p scuzz -- test examples/nav
