name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make zlib1g-dev libbz2-dev libssl-dev
      - name: Bootstrap product CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bootstrap.sh
      - name: Share product CLI
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-ci-linux
          path: examples/cli/build/cli
          if-no-files-found: error
          retention-days: 1

  linux-checks:
    name: linux-${{ matrix.name }}
    needs: linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            slices: hello tyck kits codegen hello-outdir
          - name: fixedpoint
            slices: fixedpoint
          - name: native
            slices: install-dry runtime asan skia embedders
          - name: apps
            slices: embedders kernel package ui pixels gpu differential new-ui desktop mobile
          - name: fuzz
            slices: embedders fuzz
          - name: web
            slices: web
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libx11-dev xvfb \
            zlib1g-dev libbz2-dev libssl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dri
      - name: Restore product CLI
        uses: actions/download-artifact@v4
        with:
          name: scuzz-ci-linux
          path: examples/cli/build
      - name: Set compiler permissions
        run: chmod +x examples/cli/build/cli
      - name: Install browser test tools
        if: matrix.name == 'web'
        run: |
          npm install --prefix "$RUNNER_TEMP/web-tools" playwright@1.63.0
          "$RUNNER_TEMP/web-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/web-tools/node_modules" >> "$GITHUB_ENV"
      - name: Run check slices
        env:
          CI_SLICES: ${{ matrix.slices }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          read -ra slices <<< "$CI_SLICES"
          for slice in "${slices[@]}"; do
            echo "::group::$slice"
            started=$SECONDS
            ./scripts/ci.sh "$slice"
            echo "$slice: $((SECONDS - started)) seconds"
            echo "::endgroup::"
          done
      - name: Upload release artifact
        if: matrix.name == 'apps'
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-linux-x86_64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

  linux-headless:
    if: always()
    needs: [linux-build, linux-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Linux checks
        env:
          BUILD_RESULT: ${{ needs.linux-build.result }}
          CHECK_RESULT: ${{ needs.linux-checks.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CHECK_RESULT" = success

  # Bounded Darwin coverage on every push/PR. Full packaging stays workflow_dispatch.
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: Runtime tests
        run: ./scripts/ci.sh runtime
      - name: Bootstrap product CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bootstrap.sh
      - name: Hello smoke
        run: ./scripts/ci.sh macos-hello

  # Full macOS packaging. Skip on push/PR.
  # Trigger manually: Actions → ci → Run workflow.
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Runtime + UI tests
        run: ./scripts/ci.sh runtime

      - name: Build embedders
        run: ./scripts/ci.sh embedders

      - name: Package release + install smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci.sh package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scuzz-macos-arm64
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

      - name: Golden PNG tests
        run: ./scripts/ci.sh ui-test

      - name: Pixel goldens (sk_sw software backend)
        run: ./scripts/ci.sh pixels
