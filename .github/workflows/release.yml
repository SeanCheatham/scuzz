# Cut a Scuzz release: bump VERSION, commit, tag, package, publish.
#
# Run workflow: version = patch | minor | major | 0.2.2
# Dry-run prints the plan and stops. Replace moves an existing tag.
# Pushing a v* tag still packages that tag (no bump).
name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or 0.2.2
        required: true
        default: patch
      replace:
        description: Move an existing tag and overwrite the GitHub Release
        type: boolean
        default: false
      dry_run:
        description: Bump in the runner only. Do not commit, tag, or publish.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scuzz-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.cut.outputs.skip }}
      tag: ${{ steps.cut.outputs.tag }}
      ref: ${{ steps.cut.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Cut version tag
        id: cut
        env:
          EVENT: ${{ github.event_name }}
          VERSION_SPEC: ${{ github.event.inputs.version }}
          REPLACE: ${{ github.event.inputs.replace }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force origin
          if [ "$DRY_RUN" = "true" ]; then
            out="$(./scripts/bump_version.sh --dry-run "$VERSION_SPEC")"
            printf '%s\n' "$out"
            tag="$(printf '%s\n' "$out" | awk -F= '/^tag=/{print $2; exit}')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/bump_version.sh "$VERSION_SPEC"
          # shellcheck source=../../../VERSION
          . ./VERSION
          tag="v${product}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION examples/cli/src/Version.scuzz
          if git diff --staged --quiet; then
            echo "VERSION already product=$product"
          else
            git commit -m "Set product version to ${product} so scuzz -V matches the release tag."
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
          head="$(git rev-parse HEAD)"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            existing="$(git rev-parse "${tag}^{commit}")"
            if [ "$existing" = "$head" ]; then
              echo "tag $tag already points at HEAD"
            elif [ "$REPLACE" = "true" ]; then
              git tag -f "$tag"
              git push --force origin "refs/tags/$tag"
            else
              echo "tag $tag exists at $existing" >&2
              echo "re-run with replace=true to move it" >&2
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$head" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: scuzz-linux-x86_64
          - runner: macos-latest
            artifact: scuzz-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Require a version tag
        env:
          SCUZZ_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          case "$SCUZZ_VERSION" in
            v[0-9]*) ;;
            *)
              echo "refusing to release from '$SCUZZ_VERSION' (expected v0.1.0-style tag)" >&2
              exit 1
              ;;
          esac
          # shellcheck source=../../../VERSION
          . ./VERSION
          if [ "$SCUZZ_VERSION" != "v${product}" ]; then
            echo "VERSION product=$product does not match tag $SCUZZ_VERSION" >&2
            exit 1
          fi

      - name: Install clang/make + X11 + Skia link deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libx11-dev: [ui] apps compile embedder-desktop (x11_present.c).
          sudo apt-get install -y clang make libx11-dev \
            zlib1g-dev libbz2-dev libssl-dev

      - name: Package release + install-from-tarball smoke
        env:
          SCUZZ_VERSION: ${{ needs.prepare.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          ./scripts/package_release.sh
          test -f "dist/scuzz-${TRIPLE}.tar.gz"
          test -x "dist/scuzz-${TRIPLE}/bin/scuzz"
          grep -q "^version=${SCUZZ_VERSION}$" "dist/scuzz-${TRIPLE}/VERSION"
          PREFIX=/tmp/scuzz-prefix
          rm -rf "$PREFIX"
          RELEASE_TGZ="$PWD/dist/scuzz-${TRIPLE}.tar.gz" PREFIX="$PREFIX" ./scripts/install.sh
          export PATH="$PREFIX/bin:$PATH"
          unset SCUZZ_HOME SCUZZ_RUNTIME || true
          rm -rf /tmp/scuzz-release-app
          scuzz new --ui --path /tmp scuzz-release-app
          scuzz test --update /tmp/scuzz-release-app
          scuzz test /tmp/scuzz-release-app
          scuzz run --headless /tmp/scuzz-release-app
          scuzz run examples/hello | tee /tmp/rel-hello.out
          grep -q "Hello, Scuzz!" /tmp/rel-hello.out
          grep -q "ready." /tmp/rel-hello.out
          # Packaged scuzz must emit the CLI so the next cut can bootstrap from this tag.
          # Drop the fingerprint from bootstrap emit. Cap Linux address space so a leak fails here.
          rm -rf examples/cli/.scuzz
          if [ "$(uname -s)" = Linux ]; then
            ulimit -v 3145728
          fi
          scuzz build examples/cli
          test -f examples/cli/build/cli.ll
          scuzz run examples/cli | tee /tmp/rel-cli.out
          grep -q "cli-ok" /tmp/rel-cli.out
          scuzz -V | tee /tmp/rel-ver.out
          grep -q "^scuzz ${SCUZZ_VERSION#v}$" /tmp/rel-ver.out

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download packaged tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scuzz-*
          merge-multiple: true

      - name: Checksums + installer asset
        run: |
          test -f dist/scuzz-linux-x86_64.tar.gz
          test -f dist/scuzz-darwin-arm64.tar.gz
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          (cd dist && sha256sum scuzz-*.tar.gz install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/scuzz-*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: "true"
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          body: |
            Scuzz CLI (`linux-x86_64`, `darwin-arm64`).

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            Pin a tag with `SCUZZ_VERSION=${{ needs.prepare.outputs.tag }}`.
            Apps need `clang` + `make`. Linux `[ui]` also needs `zlib1g-dev libbz2-dev`.
