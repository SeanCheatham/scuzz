# Publish scuzz tarballs to a GitHub Release.
# Push a v* tag (or Run workflow with that tag). Not part of default CI.
name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: scuzz-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: scuzz-linux-x86_64
          - runner: macos-latest
            artifact: scuzz-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require a version tag
        env:
          SCUZZ_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$SCUZZ_VERSION" in
            v[0-9]*) ;;
            *)
              echo "refusing to release from '$SCUZZ_VERSION' (expected v0.1.0-style tag)" >&2
              exit 1
              ;;
          esac

      - name: Install clang/make + X11 + Skia link deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libx11-dev: [ui] apps compile embedder-desktop (x11_present.c).
          sudo apt-get install -y clang make libx11-dev \
            zlib1g-dev libbz2-dev libbrotli-dev

      - name: Install Homebrew Skia link deps
        if: runner.os == 'macOS'
        run: brew install brotli bzip2

      - name: Install Rust (stable with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Package release + install-from-tarball smoke
        env:
          SCUZZ_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export LIBRARY_PATH="$(brew --prefix)/lib:$(brew --prefix bzip2)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          fi
          TRIPLE="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
          ./scripts/package_release.sh
          test -f "dist/scuzz-${TRIPLE}.tar.gz"
          test -x "dist/scuzz-${TRIPLE}/bin/scuzz"
          grep -q "^version=${SCUZZ_VERSION}$" "dist/scuzz-${TRIPLE}/VERSION"
          PREFIX=/tmp/scuzz-prefix
          rm -rf "$PREFIX"
          RELEASE_TGZ="$PWD/dist/scuzz-${TRIPLE}.tar.gz" PREFIX="$PREFIX" ./scripts/install.sh
          export PATH="$PREFIX/bin:$PATH"
          unset SCUZZ_HOME SCUZZ_RUNTIME || true
          rm -rf /tmp/scuzz-release-app
          scuzz new --ui --path /tmp scuzz-release-app
          scuzz test /tmp/scuzz-release-app
          scuzz run --headless /tmp/scuzz-release-app

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/scuzz-*.tar.gz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download packaged tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scuzz-*
          merge-multiple: true

      - name: Checksums + installer asset
        run: |
          test -f dist/scuzz-linux-x86_64.tar.gz
          test -f dist/scuzz-darwin-arm64.tar.gz
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          (cd dist && sha256sum scuzz-*.tar.gz install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/scuzz-*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: "true"
          generate_release_notes: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          body: |
            Rust `scuzz` (`linux-x86_64`, `darwin-arm64`).

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            Pin a tag with `SCUZZ_VERSION=${{ github.event.inputs.tag || github.ref_name }}`.
            Apps need `clang` + `make`. Linux `[ui]` also needs `zlib1g-dev libbz2-dev libbrotli-dev`.
