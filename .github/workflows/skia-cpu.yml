# As-needed Skia CPU prebuilt that exports sk_capi.h.
# Trigger manually or by pushing a skia-cpu-v* tag. Not part of default CI.
name: skia-cpu

on:
  workflow_dispatch:
    inputs:
      skia_branch:
        description: Skia git branch/tag
        required: false
        default: chrome/m131
      release_tag:
        description: GitHub Release tag (e.g. skia-cpu-v0.1)
        required: true
  push:
    tags:
      - "skia-cpu-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - runner: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make ninja-build python3 git curl xxd \
            libfontconfig-dev g++ fonts-dejavu-core \
            libfreetype-dev libbrotli-dev libbz2-dev zlib1g-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build sk_capi Skia prebuilt
        env:
          SCUZZ_SKIA_BRANCH: ${{ github.event.inputs.skia_branch || 'chrome/m131' }}
          SCUZZ_SKIA_TRIPLE: ${{ matrix.triple }}
        run: ./scripts/build_skia_prebuilt.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-${{ matrix.triple }}-cpu
          path: dist/skia-${{ matrix.triple }}-cpu.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: skia-*-cpu
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: false
          body: |
            Scuzz `sk_capi` CPU prebuilts (`x86_64-unknown-linux-gnu`, `aarch64-apple-darwin`).
            Install with:
            ```
            SCUZZ_SKIA_URL=<asset-url> ./scripts/fetch_skia.sh
            ```
            Or pin a `{triple}` template in `third_party/skia/PIN`:
            ```
            url=https://github.com/<owner>/<repo>/releases/download/<tag>/skia-{triple}-cpu.tar.gz
            ```
            `fetch_skia.sh` / `package_release.sh` substitute the host triple.
